<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang — NestMart Hardware</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">⚡ NestMart <span>Hardware</span></a>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="products.html">Produk</a>
        <a href="cart.html" class="active cart-link">
          Keranjang <span id="cart-count" class="cart-badge">0</span>
        </a>
        <span id="user-area"></span>
      </nav>
    </header>

    <main class="cart-page">
      <h2>🛒 Keranjang Belanja</h2>
      <div id="cart-empty" class="cart-empty">
        <p>Keranjang masih kosong.</p>
        <a href="products.html" class="btn-primary">Mulai Belanja</a>
      </div>
      <div id="cart-content" class="cart-content" style="display: none">
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-summary">
          <h3>Ringkasan Belanja</h3>
          <div class="summary-row">
            <span>Total Item</span>
            <span id="summary-items">0</span>
          </div>
          <div class="summary-row total">
            <span>Total Harga</span>
            <span id="summary-total">Rp 0</span>
          </div>
          <button id="checkout-btn" class="btn-primary btn-full">
            Checkout
          </button>
        </div>
      </div>
    </main>

    <!-- Checkout Success Toast -->
    <div class="toast" id="toast"></div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
      <div class="modal-content auth-modal-content">
        <button class="modal-close" id="auth-modal-close">&times;</button>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>
        <form id="auth-form" class="auth-form">
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input
              type="email"
              id="auth-email"
              placeholder="contoh@email.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input
              type="password"
              id="auth-password"
              placeholder="Minimal 6 karakter"
              required
              minlength="6"
              autocomplete="current-password"
            />
          </div>
          <div class="form-group" id="auth-name-group" style="display: none">
            <label for="auth-name">Nama</label>
            <input
              type="text"
              id="auth-name"
              placeholder="Nama lengkap"
              autocomplete="name"
            />
          </div>
          <p class="auth-error" id="auth-error"></p>
          <button type="submit" class="btn-primary btn-full" id="auth-submit">
            Login
          </button>
        </form>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 NestMart Hardware. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
