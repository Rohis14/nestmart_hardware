<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produk — NestMart Hardware</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">⚡ NestMart <span>Hardware</span></a>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="products.html" class="active">Produk</a>
        <a href="cart.html" class="cart-link">
          Keranjang <span id="cart-count" class="cart-badge">0</span>
        </a>
        <span id="user-area"></span>
      </nav>
    </header>

    <main class="products-page">
      <aside class="sidebar">
        <h3>Filter</h3>
        <div class="filter-group">
          <label>Kategori</label>
          <select id="filter-category">
            <option value="">Semua</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Brand</label>
          <select id="filter-brand">
            <option value="">Semua</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Harga Maksimal</label>
          <input
            type="range"
            id="filter-price"
            min="0"
            max="3000"
            value="3000"
            step="50"
          />
          <span id="price-label">Rp 3.000.000</span>
        </div>
        <button id="filter-reset" class="btn-outline">Reset Filter</button>
      </aside>

      <section class="product-list">
        <div class="product-header">
          <h2>Semua Produk</h2>
          <span id="result-count"></span>
        </div>
        <div class="product-grid" id="product-grid">
          <p class="loading-text">Memuat produk...</p>
        </div>
      </section>
    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
      <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
      <div class="modal-content auth-modal-content">
        <button class="modal-close" id="auth-modal-close">&times;</button>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>
        <form id="auth-form" class="auth-form">
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input
              type="email"
              id="auth-email"
              placeholder="contoh@email.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input
              type="password"
              id="auth-password"
              placeholder="Minimal 6 karakter"
              required
              minlength="6"
              autocomplete="current-password"
            />
          </div>
          <div class="form-group" id="auth-name-group" style="display: none">
            <label for="auth-name">Nama</label>
            <input
              type="text"
              id="auth-name"
              placeholder="Nama lengkap"
              autocomplete="name"
            />
          </div>
          <p class="auth-error" id="auth-error"></p>
          <button type="submit" class="btn-primary btn-full" id="auth-submit">
            Login
          </button>
        </form>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 NestMart Hardware. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
